<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Administratora — CopyCabana</title>
  <link rel="icon" href="images/favicon.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Montserrat:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            donkerblauw: '#063A60',
            blauw: '#00456F',
            geel: '#FFED00',
            wit: '#F5F5F5',
            lichtgrijs: '#D9D9DD',
            magenta: '#D51A70',
            groen: '#7FBF45',
            paars: '#6B3FA0',
          },
          fontFamily: {
            heading: ['Montserrat', 'sans-serif'],
            body: ['Montserrat', 'sans-serif'],
            logo: ['Caveat', 'cursive'],
          },
        },
      },
    }
  </script>
  <link rel="stylesheet" href="css/custom.css">
  <style>
    .admin-login-bg {
      background: linear-gradient(135deg, #063A60 0%, #00456F 50%, #D51A70 100%);
    }
    .admin-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }
    .price-input {
      width: 100px;
      padding: 6px 10px;
      border: 1px solid #D9D9DD;
      border-radius: 6px;
      font-size: 14px;
      text-align: right;
    }
    .price-input:focus {
      outline: none;
      border-color: #D51A70;
      box-shadow: 0 0 0 2px rgba(213,26,112,0.15);
    }
    .option-row {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #f9fafb;
    }
    .option-row:hover { background: #f3f4f6; }
    .tab-btn { transition: all 0.2s; }
    .tab-btn.active { background: #063A60; color: white; }
    .toast {
      position: fixed; bottom: 24px; right: 24px;
      background: #063A60; color: white; padding: 12px 24px;
      border-radius: 8px; font-size: 14px; z-index: 9999;
      transform: translateY(100px); opacity: 0; transition: all 0.3s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { background: #7FBF45; }
    .toast.error { background: #D51A70; }
  </style>
</head>
<body x-data="adminApp()" x-init="init()">

  <!-- TOAST -->
  <div class="toast" :class="{ show: toast.show, success: toast.type === 'success', error: toast.type === 'error' }" x-text="toast.message"></div>

  <!-- ========== LOGIN SCREEN ========== -->
  <template x-if="!loggedIn">
    <div class="min-h-screen flex items-center justify-center admin-login-bg">
      <div class="admin-card p-8 w-full max-w-sm mx-4">
        <div class="text-center mb-6">
          <a href="index.html" class="font-logo text-3xl text-donkerblauw no-underline">CopyCabana</a>
          <h2 class="text-xl font-semibold mt-2">Panel Administratora</h2>
        </div>
        <form @submit.prevent="login()">
          <div class="mb-4">
            <label class="block text-sm font-medium text-gray-700 mb-1">Hasło</label>
            <input type="password" x-model="password" class="w-full px-4 py-2 border border-lichtgrijs rounded-lg focus:outline-none focus:border-magenta" placeholder="Wprowadź hasło">
            <p x-show="loginError" class="text-magenta text-xs mt-1">Błędne hasło</p>
          </div>
          <button type="submit" class="w-full bg-donkerblauw text-white py-2 rounded-lg font-semibold hover:bg-blauw transition">Zaloguj się</button>
        </form>
        <p class="text-center text-gray-400 text-xs mt-4">Domyślne hasło: <strong>admin123</strong></p>
      </div>
    </div>
  </template>

  <!-- ========== ADMIN PANEL ========== -->
  <template x-if="loggedIn">
    <div class="min-h-screen bg-gray-50">
      <!-- Top Bar -->
      <nav class="bg-donkerblauw text-white px-6 py-3 flex items-center justify-between sticky top-0 z-50">
        <div class="flex items-center gap-4">
          <a href="index.html" class="font-logo text-xl no-underline text-geel">CopyCabana</a>
          <span class="text-white/60 text-sm">| Panel Admina</span>
        </div>
        <div class="flex items-center gap-4">
          <button @click="exportData()" class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition">
            <i class="fas fa-download mr-1"></i> Eksportuj cennik
          </button>
          <label class="text-sm bg-white/10 hover:bg-white/20 px-3 py-1.5 rounded-lg transition cursor-pointer">
            <i class="fas fa-upload mr-1"></i> Importuj cennik
            <input type="file" accept=".json" @change="importData($event)" class="hidden">
          </label>
          <button @click="logout()" class="text-sm bg-magenta/80 hover:bg-magenta px-3 py-1.5 rounded-lg transition">
            <i class="fas fa-sign-out-alt mr-1"></i> Wyloguj
          </button>
        </div>
      </nav>

      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Tab Navigation -->
        <div class="flex flex-wrap gap-2 mb-6">
          <button @click="activeTab = 'products'" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium border" :class="activeTab === 'products' ? 'active border-donkerblauw' : 'border-lichtgrijs'">
            <i class="fas fa-box mr-1"></i> Produkty i ceny
          </button>
          <button @click="activeTab = 'orders'" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium border" :class="activeTab === 'orders' ? 'active border-donkerblauw' : 'border-lichtgrijs'">
            <i class="fas fa-shopping-cart mr-1"></i> Zamówienia
          </button>
          <button @click="activeTab = 'settings'" class="tab-btn px-4 py-2 rounded-lg text-sm font-medium border" :class="activeTab === 'settings' ? 'active border-donkerblauw' : 'border-lichtgrijs'">
            <i class="fas fa-cog mr-1"></i> Ustawienia
          </button>
        </div>

        <!-- ========== PRODUCTS TAB ========== -->
        <div x-show="activeTab === 'products'">
          <!-- Product List -->
          <div x-show="!editingProduct">
            <div class="flex items-center justify-between mb-4">
              <h2 class="text-xl font-semibold">Produkty i cennik</h2>
              <button @click="resetAllPrices()" class="text-sm text-magenta hover:underline">
                <i class="fas fa-undo mr-1"></i> Przywróć domyślne ceny
              </button>
            </div>
            <div class="grid gap-3">
              <template x-for="(product, slug) in prices" :key="slug">
                <div class="admin-card p-4 flex items-center justify-between hover:shadow-md transition cursor-pointer" @click="editProduct(slug)">
                  <div class="flex items-center gap-4">
                    <img :src="product.image" class="w-12 h-12 object-contain rounded-lg bg-gray-100 p-1">
                    <div>
                      <h3 class="font-semibold text-sm" x-text="product.name"></h3>
                      <p class="text-xs text-gray-500" x-text="'Typ: ' + product.calculatorType"></p>
                    </div>
                  </div>
                  <div class="flex items-center gap-3">
                    <span class="text-xs px-2 py-1 rounded-full"
                      :class="{
                        'bg-green-100 text-green-700': product.calculatorType === 'options',
                        'bg-blue-100 text-blue-700': product.calculatorType === 'area',
                        'bg-yellow-100 text-yellow-700': product.calculatorType === 'ksero',
                        'bg-purple-100 text-purple-700': product.calculatorType === 'fixed'
                      }"
                      x-text="product.calculatorType"></span>
                    <i class="fas fa-chevron-right text-gray-400"></i>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <!-- Product Editor -->
          <div x-show="editingProduct">
            <button @click="editingProduct = null; editSlug = ''" class="text-sm text-donkerblauw hover:underline mb-4">
              <i class="fas fa-arrow-left mr-1"></i> Wróć do listy
            </button>

            <template x-if="editingProduct">
              <div class="admin-card p-6">
                <div class="flex items-center gap-4 mb-6">
                  <img :src="editingProduct.image" class="w-16 h-16 object-contain rounded-lg bg-gray-100 p-2">
                  <div>
                    <h2 class="text-xl font-bold" x-text="editingProduct.name"></h2>
                    <p class="text-sm text-gray-500" x-text="'Slug: ' + editSlug + ' | Typ: ' + editingProduct.calculatorType"></p>
                  </div>
                </div>

                <!-- Options-type product -->
                <template x-if="editingProduct.calculatorType === 'options'">
                  <div>
                    <template x-for="(option, optKey) in editingProduct.options" :key="optKey">
                      <div class="mb-6 border border-gray-200 rounded-xl p-4">
                        <h3 class="font-semibold text-sm mb-3" x-text="option.label + ' (' + optKey + ')'"></h3>
                        <template x-if="option.type === 'select'">
                          <div class="space-y-2">
                            <template x-for="(val, vIdx) in option.values" :key="vIdx">
                              <div class="option-row">
                                <span class="text-sm flex-1" x-text="val.label"></span>
                                <input type="number" step="0.01" class="price-input"
                                  :value="val.price"
                                  @input="updateOptionPrice(editSlug, optKey, vIdx, parseFloat($event.target.value))">
                                <span class="text-xs text-gray-500">zł</span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Area-type product -->
                <template x-if="editingProduct.calculatorType === 'area'">
                  <div>
                    <div class="mb-4 border border-gray-200 rounded-xl p-4">
                      <h3 class="font-semibold text-sm mb-3">Cena za m²</h3>
                      <div class="option-row">
                        <span class="text-sm flex-1">Cena za metr kwadratowy</span>
                        <input type="number" step="0.01" class="price-input"
                          :value="editingProduct.pricePerM2"
                          @input="editingProduct.pricePerM2 = parseFloat($event.target.value)">
                        <span class="text-xs text-gray-500">zł/m²</span>
                      </div>
                      <div class="option-row mt-2">
                        <span class="text-sm flex-1">Cena minimalna</span>
                        <input type="number" step="0.01" class="price-input"
                          :value="editingProduct.minPrice"
                          @input="editingProduct.minPrice = parseFloat($event.target.value)">
                        <span class="text-xs text-gray-500">zł</span>
                      </div>
                    </div>
                    <template x-for="(option, optKey) in (editingProduct.options || {})" :key="optKey">
                      <div class="mb-6 border border-gray-200 rounded-xl p-4">
                        <h3 class="font-semibold text-sm mb-3" x-text="option.label"></h3>
                        <template x-if="option.type === 'select'">
                          <div class="space-y-2">
                            <template x-for="(val, vIdx) in option.values" :key="vIdx">
                              <div class="option-row">
                                <span class="text-sm flex-1" x-text="val.label"></span>
                                <input type="number" step="0.01" class="price-input"
                                  :value="val.price"
                                  @input="updateOptionPrice(editSlug, optKey, vIdx, parseFloat($event.target.value))">
                                <span class="text-xs text-gray-500">zł</span>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </template>
                  </div>
                </template>

                <!-- Ksero-type product -->
                <template x-if="editingProduct.calculatorType === 'ksero'">
                  <div>
                    <div class="border border-gray-200 rounded-xl p-4">
                      <h3 class="font-semibold text-sm mb-3">Ceny jednostkowe (za sztukę)</h3>
                      <table class="w-full text-sm">
                        <thead>
                          <tr class="border-b">
                            <th class="text-left py-2">Format</th>
                            <th class="text-right py-2">Czarno-biały</th>
                            <th class="text-right py-2">Kolor</th>
                          </tr>
                        </thead>
                        <tbody>
                          <template x-for="(prices, format) in editingProduct.prices" :key="format">
                            <tr class="border-b last:border-0">
                              <td class="py-2 font-medium" x-text="format"></td>
                              <td class="text-right">
                                <input type="number" step="0.01" class="price-input"
                                  :value="prices.czarnobialy"
                                  @input="editingProduct.prices[format].czarnobialy = parseFloat($event.target.value)">
                              </td>
                              <td class="text-right">
                                <input type="number" step="0.01" class="price-input"
                                  :value="prices.kolor"
                                  @input="editingProduct.prices[format].kolor = parseFloat($event.target.value)">
                              </td>
                            </tr>
                          </template>
                        </tbody>
                      </table>
                    </div>
                  </div>
                </template>

                <!-- Fixed-type product -->
                <template x-if="editingProduct.calculatorType === 'fixed'">
                  <div>
                    <div class="border border-gray-200 rounded-xl p-4">
                      <h3 class="font-semibold text-sm mb-3">Ceny usług</h3>
                      <div class="space-y-2">
                        <template x-for="(item, iIdx) in editingProduct.items" :key="iIdx">
                          <div class="option-row">
                            <span class="text-sm flex-1" x-text="item.label"></span>
                            <input type="number" step="0.01" class="price-input"
                              :value="item.price"
                              @input="updateFixedPrice(editSlug, iIdx, parseFloat($event.target.value))">
                            <span class="text-xs text-gray-500">zł</span>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>

                <div class="mt-6 flex gap-3">
                  <button @click="saveProduct()" class="bg-groen text-white px-6 py-2 rounded-lg font-semibold hover:bg-green-600 transition">
                    <i class="fas fa-save mr-1"></i> Zapisz zmiany
                  </button>
                  <button @click="editingProduct = null; editSlug = ''" class="bg-gray-200 text-gray-700 px-6 py-2 rounded-lg hover:bg-gray-300 transition">
                    Anuluj
                  </button>
                </div>
              </div>
            </template>
          </div>
        </div>

        <!-- ========== ORDERS TAB ========== -->
        <div x-show="activeTab === 'orders'">
          <h2 class="text-xl font-semibold mb-4">Zamówienia (lokalne)</h2>
          <p class="text-sm text-gray-500 mb-4">Zamówienia złożone przez klientów (przechowywane w localStorage przeglądarki).</p>
          <template x-if="orders.length === 0">
            <div class="admin-card p-8 text-center text-gray-400">
              <i class="fas fa-inbox text-4xl mb-3"></i>
              <p>Brak zamówień</p>
            </div>
          </template>
          <div class="space-y-3">
            <template x-for="order in orders" :key="order.id">
              <div class="admin-card p-4">
                <div class="flex items-center justify-between mb-2">
                  <span class="font-semibold text-sm" x-text="'Zamówienie #' + order.id"></span>
                  <span class="text-xs text-gray-500" x-text="new Date(order.date).toLocaleString('pl-PL')"></span>
                </div>
                <template x-for="item in order.items" :key="item.id">
                  <div class="flex justify-between text-sm py-1 border-t border-gray-100">
                    <span x-text="item.summary"></span>
                    <span class="font-medium" x-text="item.price.toFixed(2).replace('.',',') + ' zł × ' + item.quantity"></span>
                  </div>
                </template>
                <div class="flex justify-between text-sm font-bold mt-2 pt-2 border-t">
                  <span>Suma:</span>
                  <span class="text-magenta" x-text="order.total.toFixed(2).replace('.',',') + ' zł'"></span>
                </div>
                <template x-if="order.customer">
                  <div class="mt-2 pt-2 border-t text-xs text-gray-500">
                    <p x-text="'Klient: ' + order.customer.name"></p>
                    <p x-text="'Email: ' + order.customer.email"></p>
                    <p x-show="order.customer.phone" x-text="'Tel: ' + order.customer.phone"></p>
                  </div>
                </template>
                <button @click="deleteOrder(order.id)" class="mt-2 text-xs text-magenta hover:underline">
                  <i class="fas fa-trash mr-1"></i> Usuń
                </button>
              </div>
            </template>
          </div>
        </div>

        <!-- ========== SETTINGS TAB ========== -->
        <div x-show="activeTab === 'settings'">
          <h2 class="text-xl font-semibold mb-4">Ustawienia</h2>
          <div class="admin-card p-6 mb-4">
            <h3 class="font-semibold mb-3">Hasło administratora</h3>
            <div class="flex gap-3 items-end">
              <div>
                <label class="text-xs text-gray-500">Nowe hasło</label>
                <input type="password" x-model="newPassword" class="w-64 px-3 py-2 border border-lichtgrijs rounded-lg text-sm" placeholder="Nowe hasło">
              </div>
              <button @change="changePassword()" class="bg-donkerblauw text-white px-4 py-2 rounded-lg text-sm hover:bg-blauw transition">
                Zmień hasło
              </button>
            </div>
          </div>
          <div class="admin-card p-6">
            <h3 class="font-semibold mb-3">Zarządzanie danymi</h3>
            <div class="space-y-3">
              <button @click="resetAllPrices()" class="text-sm text-magenta hover:underline">
                <i class="fas fa-undo mr-1"></i> Przywróć wszystkie ceny do domyślnych
              </button>
              <p class="text-xs text-gray-400">Ta operacja nadpisze wszystkie zmiany cen aktualnymi wartościami domyślnymi.</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="data/prices.js"></script>
  <script src="js/cart.js"></script>
  <script>
    function adminApp() {
      return {
        loggedIn: false,
        password: '',
        newPassword: '',
        loginError: false,
        activeTab: 'products',
        prices: {},
        editingProduct: null,
        editSlug: '',
        orders: [],
        toast: { show: false, message: '', type: 'success' },

        init() {
          const session = localStorage.getItem('copycabana_admin_session');
          if (session === 'active') this.loggedIn = true;
          this.prices = PriceManager.getAll();
          this.loadOrders();
        },

        login() {
          const stored = localStorage.getItem('copycabana_admin_password') || 'admin123';
          if (this.password === stored) {
            this.loggedIn = true;
            this.loginError = false;
            localStorage.setItem('copycabana_admin_session', 'active');
          } else {
            this.loginError = true;
          }
        },

        logout() {
          this.loggedIn = false;
          localStorage.removeItem('copycabana_admin_session');
        },

        editProduct(slug) {
          this.editSlug = slug;
          this.editingProduct = JSON.parse(JSON.stringify(this.prices[slug]));
        },

        saveProduct() {
          this.prices[this.editSlug] = JSON.parse(JSON.stringify(this.editingProduct));
          PriceManager.save(this.prices);
          this.editingProduct = null;
          this.editSlug = '';
          this.showToast('Zapisano zmiany', 'success');
        },

        updateOptionPrice(slug, optKey, valIdx, newPrice) {
          if (this.prices[slug] && this.prices[slug].options[optKey]) {
            this.prices[slug].options[optKey].values[valIdx].price = newPrice;
          }
        },

        updateFixedPrice(slug, itemIdx, newPrice) {
          if (this.prices[slug] && this.prices[slug].items) {
            this.prices[slug].items[itemIdx].price = newPrice;
          }
        },

        resetAllPrices() {
          if (confirm('Na pewno przywrócić wszystkie ceny do domyślnych?')) {
            PriceManager.reset();
            this.prices = PriceManager.getAll();
            this.showToast('Przywrócono domyślne ceny', 'success');
          }
        },

        exportData() {
          PriceManager.exportAll();
          this.showToast('Pobrano plik cennika', 'success');
        },

        importData(event) {
          const file = event.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (e) => {
            if (PriceManager.importAll(e.target.result)) {
              this.prices = PriceManager.getAll();
              this.showToast('Zaimportowano cennik', 'success');
            } else {
              this.showToast('Błąd importu — nieprawidłowy format JSON', 'error');
            }
          };
          reader.readAsText(file);
        },

        changePassword() {
          if (this.newPassword.length < 4) {
            this.showToast('Hasło musi mieć minimum 4 znaki', 'error');
            return;
          }
          localStorage.setItem('copycabana_admin_password', this.newPassword);
          this.newPassword = '';
          this.showToast('Hasło zmienione', 'success');
        },

        loadOrders() {
          const stored = localStorage.getItem('copycabana_orders');
          if (stored) {
            try { this.orders = JSON.parse(stored); } catch(e) { this.orders = []; }
          }
        },

        deleteOrder(id) {
          if (confirm('Usunąć to zamówienie?')) {
            this.orders = this.orders.filter(o => o.id !== id);
            localStorage.setItem('copycabana_orders', JSON.stringify(this.orders));
            this.showToast('Usunięto zamówienie', 'success');
          }
        },

        showToast(message, type = 'success') {
          this.toast = { show: true, message, type };
          setTimeout(() => { this.toast.show = false; }, 3000);
        }
      };
    }
  </script>
</body>
</html>
